<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>TakMD desk-scene GLB assets</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0d1018; color: #d6d2c8; font-family: ui-monospace, 'JetBrains Mono', monospace; }
  h1 { font-size: 15px; font-weight: 500; letter-spacing: 0.06em; padding: 18px 22px 4px; margin: 0; color: #ffb454; }
  p.sub { margin: 0; padding: 0 22px 14px; font-size: 12px; color: #6d6f76; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; padding: 0 22px 30px; }
  .card { background: #14171e; border: 1px solid #232733; border-radius: 10px; overflow: hidden; }
  .card header { display: flex; justify-content: space-between; padding: 10px 12px; font-size: 12px; }
  .card header .tag { color: #6d6f76; }
  model-viewer { width: 100%; height: 300px; background: #181c24; --poster-color: #181c24; }
</style>
</head>
<body>
<h1>desk-scene assets — /public/models</h1>
<p class="sub">drag to rotate · scroll to zoom · auto-rotating. interactive = hover/click objects in the scene, deco = personal props.</p>
<div class="grid" id="grid"></div>
<script>
const assets = [
  ['spine', 'interactive → /ube'],
  ['journals', 'interactive → /cv'],
  ['globe', 'interactive → /education'],
  ['brain', 'interactive → /research'],
  ['keyboard', 'interactive → /ai'],
  ['belt', 'interactive (about TODO)'],
  ['card', 'interactive → /contact'],
  ['clock', 'interactive · live time'],
  ['computer', 'deco · Mac mini'],
  ['surfboard', 'deco · Bing Beacon'],
  ['vwbus', 'deco · VW bus + board'],
  ['firetruck', 'deco · toy truck'],
];
document.getElementById('grid').innerHTML = assets.map(([name, tag]) => `
  <div class="card">
    <header><span>${name}.glb</span><span class="tag">${tag}</span></header>
    <model-viewer src="/models/${name}.glb" camera-controls auto-rotate shadow-intensity="0.8"
      exposure="1.05" interaction-prompt="none"></model-viewer>
  </div>`).join('');
</script>
</body>
</html>
